<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>我的资料 · OpenTeamily</title>
  <link rel="stylesheet" href="/shell/app.css">
  <link rel="stylesheet" href="/profile/app.css">
  <script type="module" src="/shell/app.mjs"></script>
  <script type="module" src="/profile/app.mjs"></script>
</head>
<body class="app-workspace">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <nav class="app-rail" aria-label="应用导航">
    <a class="brand-mark" href="/chat" title="OpenTeamily / FlyBot">FB</a>
    <a href="/chat" title="聊天">聊天</a>
    <a href="/agents" title="智能体">智能体</a>
    <a href="/automations" title="自动化">自动化</a>
    <a href="/memory" title="记忆">记忆</a>
    <a href="/space" title="作品">作品</a>
    <a href="/discover" title="发现">发现</a>
    <span class="rail-spacer"></span>
    <a href="/profile" class="rail-signed-in" hidden title="我的资料">我</a>
    <button type="button" id="appearance-toggle" class="rail-link rail-signed-in" hidden title="切换浅色或深色。会写入已有外观设置；按钮在深色下显示「深色」。点击后的标签变化未经 Teamily 核实。">浅色</button>
    <a href="/download" title="下载">下载</a>
    <div class="account-slot" hidden>
      <button type="button" id="account-menu-button" class="account-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" title="账户菜单">账户</button>
      <div id="account-menu" class="account-menu" role="menu" hidden>
        <p id="account-identity" class="account-identity"></p>
        <a href="/profile" role="menuitem">查看我的资料</a>
        <a href="/team" role="menuitem">创建团队</a>
        <div class="account-sub">
          <button type="button" id="help-menu-button" aria-expanded="false" aria-controls="help-menu">帮助</button>
          <div id="help-menu" hidden>
            <a href="/guide" role="menuitem">帮助中心</a>
            <a href="/download" role="menuitem">下载</a>
            <a href="/settings#send-shortcut" role="menuitem">快捷键</a>
            <button type="button" disabled title="未实现：还没有 OpenTeamily 服务条款页">服务条款</button>
            <button type="button" disabled title="未实现：还没有 OpenTeamily 隐私政策页">隐私政策</button>
            <a href="https://github.com/openTeamily/openTeamily/issues" rel="noreferrer" target="_blank" role="menuitem" title="指向本仓库的 issue 列表，不是 Teamily 的联系邮箱">报告问题</a>
          </div>
        </div>
        <a href="/settings" role="menuitem">所有设置</a>
        <form id="logout-form" method="post" action="/v1/auth/logout">
          <button type="submit">退出登录</button>
        </form>
      </div>
    </div>
  </nav>
  <p id="status" role="status"></p>
  <main id="main">
  <section id="login-panel" hidden>
    <h2>登录</h2>
    <form id="login-form" method="post" action="/v1/auth/login">
      <label>用户名 <input id="username" name="username" required autocomplete="username" maxlength="64"></label>
      <label>密码 <input id="password" name="password" type="password" required autocomplete="current-password" minlength="12" maxlength="256"></label>
      <button type="submit">登录</button>
    </form>
  </section>
  <section id="main-panel" hidden>
    <header class="page-top">
      <h1>我的资料</h1>
      <p class="note">公开资料会显示昵称、Teamily ID、简介、标签、性别、所在地和网站；人生目标仅你自己可见。头像、帖子和关注/粉丝仍未实现。</p>
      <p id="whoami"></p>
      <p>用户名 <strong id="profile-username"></strong></p>
    </header>
    <form id="profile-form" class="profile-form">
      <div class="profile-layout">
        <section class="profile-card" aria-label="公开资料">
          <h2>公开资料</h2>
          <div class="profile-grid">
            <label>昵称
              <input id="profile-name" name="name" maxlength="40" required autocomplete="nickname">
            </label>
            <label>Teamily ID
              <input id="profile-handle" name="handle" maxlength="30" placeholder="3–30 位小写字母、数字、点或下划线">
            </label>
            <label class="wide">个人简介
              <textarea id="profile-bio" name="bio" maxlength="200" rows="3" placeholder="介绍一下你自己"></textarea>
            </label>
            <label class="wide">标签
              <input id="profile-tags" name="tags" maxlength="200" placeholder="用逗号分隔，最多 8 个">
            </label>
            <label>性别
              <select id="profile-gender" name="gender">
                <option value="">未设置</option>
                <option value="male">男</option>
                <option value="female">女</option>
                <option value="other">其他</option>
              </select>
            </label>
            <label>所在地
              <input id="profile-location" name="location" maxlength="80" placeholder="城市，国家">
            </label>
            <label class="wide">网站
              <input id="profile-website" name="website" maxlength="200" placeholder="https://...">
            </label>
          </div>
          <p id="profile-meta" class="note"></p>
        </section>
        <section class="profile-card" aria-label="人生目标">
          <h2>人生目标</h2>
          <p class="note">仅你自己可见。可以留空。</p>
          <div class="profile-goals">
            <label>健康与身心 <input id="goal-health" maxlength="200" placeholder="例如：每周跑两次"></label>
            <label>财务目标 <input id="goal-finance" maxlength="200" placeholder="例如：存够 6 个月生活费"></label>
            <label>职业发展 <input id="goal-career" maxlength="200" placeholder="例如：学习产品设计"></label>
            <label>兴趣爱好 <input id="goal-hobbies" maxlength="200" placeholder="例如：今年读 20 本书"></label>
            <label>家庭与关系 <input id="goal-family" maxlength="200" placeholder="例如：多给父母打电话"></label>
            <label>效率 <input id="goal-productivity" maxlength="200" placeholder="例如：每天清空收件箱"></label>
            <label>其他 <input id="goal-other" maxlength="200" placeholder="其他希望被帮助的事"></label>
          </div>
        </section>
      </div>
      <div class="profile-actions">
        <button type="submit" id="profile-save">保存</button>
        <button type="button" id="profile-reload" class="secondary">重新加载</button>
        <a id="profile-public" href="/v1/profile" target="_blank" rel="noreferrer">查看公开主页</a>
      </div>
    </form>
  </section>
  </main>
</body>
</html>
