<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>创建团队 · OpenTeamily</title>
  <link rel="stylesheet" href="/team/app.css">
  <script type="module" src="/team/app.mjs"></script>
</head>
<body>
  <header>
    <p class="brand">OpenTeamily / FlyBot</p>
    <h1>创建团队</h1>
    <p class="note">分三步创建：名称最多 60 个字，团队 ID 为 3 到 30 个小写字母、数字或连字符，然后选择新建独立工作区或把当前工作区转成团队。团队内的角色和邀请还没有和 Teamily 对照过，不能写成已经功能对等。</p>
    <nav>
      <a href="/settings">账号设置</a>
      <a href="/automations">自动化</a>
    </nav>
  </header>
  <p id="status" role="status"></p>
  <section id="login-panel" hidden>
    <h2>登录</h2>
    <form id="login-form" method="post" action="/v1/auth/login">
      <label>用户名 <input id="username" name="username" required autocomplete="username" maxlength="64"></label>
      <label>密码 <input id="password" name="password" type="password" required autocomplete="current-password" minlength="12" maxlength="256"></label>
      <button type="submit">登录</button>
    </form>
    <div id="oidc-providers"></div>
  </section>
  <section id="main-panel" hidden>
    <p id="whoami"></p>
    <p id="steps"><span data-step="1" aria-current="step">1 名称</span><span data-step="2">2 团队 ID</span><span data-step="3">3 工作区</span></p>
    <form id="wizard-form" method="post" action="/v1/teams">
      <div id="step-1" class="step">
        <label>团队名称
          <input type="text" name="name" maxlength="60" required autocomplete="organization">
        </label>
        <p class="note">最多 60 个字。</p>
      </div>
      <div id="step-2" class="step" hidden>
        <label>团队 ID
          <input type="text" name="slug" maxlength="30" required autocomplete="off" spellcheck="false">
        </label>
        <p class="note">3 到 30 个字符，只能用小写字母、数字和连字符，并且不能以连字符开头或结尾。</p>
      </div>
      <div id="step-3" class="step" hidden>
        <label><input type="radio" name="mode" value="new" checked> 新建独立工作区</label>
        <label><input type="radio" name="mode" value="convert"> 把当前工作区转成团队</label>
        <label>要转换的工作区
          <select name="workspace_id"></select>
        </label>
      </div>
      <div class="actions">
        <button type="button" id="back" hidden>上一步</button>
        <button type="button" id="next">下一步</button>
        <button type="submit" id="submit" hidden>创建团队</button>
      </div>
    </form>
    <form id="logout-form" method="post" action="/v1/auth/logout">
      <button type="submit">退出登录</button>
    </form>
  </section>
</body>
</html>
