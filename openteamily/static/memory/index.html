<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>记忆 · OpenTeamily</title>
  <link rel="stylesheet" href="/shell/app.css">
  <link rel="stylesheet" href="/memory/app.css">
  <script type="module" src="/shell/app.mjs"></script>
  <script type="module" src="/memory/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header>
    <p class="brand">OpenTeamily / FlyBot</p>
    <h1>记忆</h1>
    <p class="note">本切片提供工作区记忆页和下一步行动的创建、浏览、编辑和删除。新建会立即落盘，作者或所有者/管理员可以改或删。图谱、画像、分享和导出尚未实现。还不能写成已经功能对等，也还没有浏览器端到端验收。</p>
    <nav aria-label="管理导航">
      <a href="/settings">账号设置</a>
      <a href="/automations">自动化</a>
      <a href="/agents">智能体</a>
      <a href="/memory">记忆</a>
      <a href="/artifacts">作品库</a>
      <a href="/members">成员</a>
      <a href="/runtimes">运行时</a>
      <a href="/team">创建团队</a>
    </nav>
  </header>
  <p id="status" role="status"></p>
  <main id="main">
  <section id="login-panel" hidden>
    <h2>登录</h2>
    <form id="login-form" method="post" action="/v1/auth/login">
      <label>用户名 <input id="username" name="username" required autocomplete="username" maxlength="64"></label>
      <label>密码 <input id="password" name="password" type="password" required autocomplete="current-password" minlength="12" maxlength="256"></label>
      <button type="submit">登录</button>
    </form>
    <div id="oidc-providers"></div>
  </section>
  <section id="main-panel" hidden>
    <p id="whoami"></p>
    <label>工作区
      <select id="workspace"></select>
    </label>
    <section id="list-panel">
      <label>搜索 <input id="search" type="text" maxlength="80" autocomplete="off"></label>
      <ul id="memory-list"></ul>
      <p id="list-empty" class="note" hidden>这个工作区还没有记忆页。</p>
      <form id="new-form">
        <label>标题 <input id="new-title" name="title" type="text" maxlength="80" required autocomplete="off"></label>
        <button type="submit" id="new-page">新建记忆页</button>
      </form>
      <section id="actions-panel">
        <h2>下一步行动</h2>
        <label>筛选
          <select id="action-filter">
            <option value="open" selected>未完成</option>
            <option value="done">已完成</option>
            <option value="">全部</option>
          </select>
        </label>
        <ul id="action-list"></ul>
        <p id="action-empty" class="note" hidden>这个工作区还没有符合筛选的下一步行动。</p>
        <form id="new-action-form">
          <label>标题 <input id="new-action-title" name="title" type="text" maxlength="80" required autocomplete="off"></label>
          <label>备注 <input id="new-action-notes" name="notes" type="text" maxlength="2000" autocomplete="off"></label>
          <label>截止日期 <input id="new-action-due" name="due" type="date"></label>
          <label>关联记忆页
            <select id="new-action-page">
              <option value="">不关联</option>
            </select>
          </label>
          <button type="submit" id="new-action">新建行动</button>
        </form>
      </section>
    </section>
    <form id="editor-form" method="post" action="/v1/workspaces" hidden>
      <label>标题 <input type="text" name="title" maxlength="80" required autocomplete="off"></label>
      <label>正文
        <textarea name="body" maxlength="8000" rows="16"></textarea>
      </label>
      <p id="editor-meta" class="note"></p>
      <div class="actions">
        <button type="submit" id="save-page">保存</button>
        <button type="button" id="delete-page">删除</button>
        <button type="button" id="close-editor">返回列表</button>
      </div>
    </form>
    <form id="action-editor-form" method="post" action="/v1/workspaces" hidden>
      <label>标题 <input type="text" name="title" maxlength="80" required autocomplete="off"></label>
      <label>备注 <textarea name="notes" maxlength="2000" rows="4"></textarea></label>
      <label>状态
        <select name="status">
          <option value="open">未完成</option>
          <option value="done">已完成</option>
        </select>
      </label>
      <label>截止日期 <input type="date" name="due"></label>
      <label>关联记忆页
        <select name="memory_page_id">
          <option value="">不关联</option>
        </select>
      </label>
      <p id="action-editor-meta" class="note"></p>
      <div class="actions">
        <button type="submit" id="save-action">保存</button>
        <button type="button" id="delete-action">删除</button>
        <button type="button" id="close-action-editor">返回列表</button>
      </div>
    </form>
    <form id="logout-form" method="post" action="/v1/auth/logout">
      <button type="submit">退出登录</button>
    </form>
  </section>
  </main>
</body>
</html>
