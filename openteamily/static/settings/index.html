<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>账号设置 · OpenTeamily</title>
  <link rel="stylesheet" href="/settings/app.css">
  <script type="module" src="/settings/app.mjs"></script>
</head>
<body>
  <header>
    <p class="brand">OpenTeamily / FlyBot</p>
    <h1>账号设置</h1>
    <p class="note">这里只编辑本仓已经提供的界面偏好。选项和默认值还没有和 Teamily 真实设置页逐项对比，不能当成功能对等。</p>
  </header>
  <p id="status" role="status"></p>
  <section id="login-panel" hidden>
    <h2>登录</h2>
    <form id="login-form" method="post" action="/v1/auth/login">
      <label>用户名 <input id="username" name="username" required autocomplete="username" maxlength="64"></label>
      <label>密码 <input id="password" name="password" type="password" required autocomplete="current-password" minlength="12" maxlength="256"></label>
      <button type="submit">登录</button>
    </form>
  </section>
  <section id="settings-panel" hidden>
    <p id="whoami"></p>
    <form id="settings-form" method="post" action="/v1/settings">
      <fieldset>
        <legend>外观</legend>
        <label><input type="radio" name="appearance" value="system"> 跟随系统</label>
        <label><input type="radio" name="appearance" value="light"> 浅色</label>
        <label><input type="radio" name="appearance" value="dark"> 深色</label>
      </fieldset>
      <fieldset>
        <legend>语言</legend>
        <label>界面语言
          <select name="language">
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </fieldset>
      <fieldset>
        <legend>发送快捷键</legend>
        <label><input type="radio" name="send_shortcut" value="enter"> Enter 发送</label>
        <label><input type="radio" name="send_shortcut" value="mod_enter"> Ctrl/⌘ + Enter 发送</label>
      </fieldset>
      <fieldset>
        <legend>消息显示</legend>
        <label><input type="checkbox" name="fold_long_messages"> 折叠长消息</label>
        <label><input type="checkbox" name="document_cards"> 把长文档收成卡片</label>
      </fieldset>
      <button type="submit" id="save">保存</button>
    </form>
    <form id="model-api-form" method="post" action="/v1/model-api">
      <fieldset>
        <legend>模型 API</legend>
        <p class="note">OpenTeamily 不用积分。默认使用平台管理员配置的模型 API；你可以在这里改成自己的。密钥只能写入，保存后不会再显示明文。</p>
        <p id="model-effective"></p>
        <label>提供商
          <select name="provider">
            <option value="">使用平台默认</option>
            <option value="openai">OpenAI 兼容</option>
            <option value="azure">Azure</option>
            <option value="anthropic">Anthropic</option>
            <option value="custom">自定义</option>
          </select>
        </label>
        <label>Base URL <input type="url" name="base_url" maxlength="512" placeholder="https://" autocomplete="off"></label>
        <label>模型 <input type="text" name="model" maxlength="128" autocomplete="off"></label>
        <label>API 密钥 <input type="password" name="api_key" maxlength="4096" autocomplete="new-password" placeholder="留空表示不更改"></label>
        <p id="model-key-state" class="note"></p>
      </fieldset>
      <button type="submit" id="save-model-api">保存模型 API</button>
    </form>
    <form id="logout-form" method="post" action="/v1/auth/logout">
      <button type="submit">退出登录</button>
    </form>
  </section>
</body>
</html>
